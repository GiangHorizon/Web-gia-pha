<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết thành viên</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-gray-100">

    <div class="max-w-6xl mx-auto p-6">

        <!-- Back -->
        <div class="mb-4">
            <a href="member.html" class="text-gray-600 hover:text-black text-sm">
                <i class="fas fa-arrow-left mr-2"></i>Quay lại
            </a>
        </div>

        <!-- Main Card -->
        <div class="bg-white border rounded shadow-sm p-4">

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

                <!-- Thông tin thành viên -->
                <div class="lg:col-span-2">

                    <div class="border rounded p-4">

                        <div class="flex gap-4">

                            <!-- Avatar -->
                            <div>
                                <img src="https://via.placeholder.com/120"
                                    class="w-28 h-28 rounded-full object-cover border">
                            </div>

                            <!-- Info -->
                            <div class="flex-1">

                                <div class="flex items-center gap-2 mb-3">
                                    <h2 class="text-xl font-bold">
                                        Nguyễn Văn C
                                    </h2>

                                    <span
                                        class="px-2 py-1 text-xs bg-gray-200 rounded">
                                        Con trai
                                    </span>
                                </div>

                                <div class="space-y-2 text-gray-700 text-sm">

                                    <p>
                                        <i class="fas fa-mars mr-2"></i>
                                        Nam
                                    </p>

                                    <p>
                                        <i class="fas fa-calendar-alt mr-2"></i>
                                        20/03/1988
                                    </p>

                                    <p>
                                        <i class="fas fa-map-marker-alt mr-2"></i>
                                        Nơi sinh: Hà Nội
                                    </p>

                                    <p>
                                        <i class="fas fa-briefcase mr-2"></i>
                                        Nghề nghiệp: Kỹ sư
                                    </p>

                                    <p>
                                        <i class="fas fa-sticky-note mr-2"></i>
                                        Ghi chú:
                                    </p>

                                </div>

                                <button
                                    class="mt-5 px-4 py-2 border rounded hover:bg-gray-100">
                                    Sửa thông tin
                                </button>

                            </div>

                        </div>

                    </div>

                    <!-- Quan hệ gia đình -->
                    <div class="border rounded p-4 mt-4">

                        <h3 class="font-semibold mb-3">
                            Thông tin gia đình
                        </h3>

                        <div class="space-y-2 text-sm">

                            <div class="flex">
                                <span class="w-24 font-medium">Cha:</span>
                                <span>Nguyễn Văn A</span>
                            </div>

                            <div class="flex">
                                <span class="w-24 font-medium">Mẹ:</span>
                                <span>Trần Thị B</span>
                            </div>

                            <div class="flex">
                                <span class="w-24 font-medium">Vợ/Chồng:</span>
                                <span>Lê Thị K</span>
                            </div>

                            <div>
                                <span class="font-medium">Con cái:</span>

                                <ul class="list-disc ml-8 mt-2">
                                    <li>Nguyễn Văn G</li>
                                    <li>Nguyễn Thị H</li>
                                </ul>
                            </div>

                        </div>

                    </div>

                </div>

                <!-- Khu vực ảnh -->
                <div>

                    <div class="border rounded p-4 h-full">

                        <h3 class="font-semibold mb-3">
                            Ảnh
                        </h3>

                        <div
                            class="border bg-gray-100 h-64 flex items-center justify-center">

                            <i
                                class="fas fa-image text-6xl text-gray-400"></i>

                        </div>

                        <!-- Gallery -->
                        <div class="grid grid-cols-3 gap-2 mt-4">

                            <div
                                class="border h-16 bg-gray-100 flex items-center justify-center">
                                <i class="fas fa-image text-gray-400"></i>
                            </div>

                            <div
                                class="border h-16 bg-gray-100 flex items-center justify-center">
                                <i class="fas fa-image text-gray-400"></i>
                            </div>

                            <div
                                class="border h-16 bg-gray-100 flex items-center justify-center">
                                <i class="fas fa-image text-gray-400"></i>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
