<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Phả Họ Nguyễn - Relationships</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-slate-100">
<div class="flex h-screen overflow-hidden">

  <!-- ================= SIDEBAR  ================= -->
  <aside class="w-64 bg-white border-r">
    <div id="menu-toggle" class="h-20 flex items-center px-6 border-b cursor-pointer hover:bg-gray-50 transition-colors">
      <i class="fas fa-bars text-2xl"></i>
    </div>

    <nav id="sidebar-nav" class="p-4 space-y-2">
      <a href="/mainpage/mainpage.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100">
        <i class="fas fa-house"></i> Home
      </a>
      <a href="/list/member.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100">
        <i class="fas fa-users"></i> Members
      </a>
      <a href="/relationships/relationships.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 text-blue-600 font-medium">
        <i class="fas fa-link"></i> Relationships
      </a>
      <a href="/statistics/statistics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100">
        <i class="fas fa-chart-column"></i> Statistics
      </a>
      <a href="/documents/documents.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100">
        <i class="fas fa-file"></i> Documents
      </a>
      <a href="/settings/settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100">
        <i class="fas fa-gear"></i> Settings
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 flex flex-col">

    <!-- ================= HEADER ================= -->
    <header class="h-20 bg-white border-b flex items-center justify-between px-8">
      <h1 class="text-3xl font-bold">GIA PHẢ HỌ NGUYỄN</h1>

      <div class="flex items-center gap-5">

        <!-- ADMIN DROPDOWN -->
        <div class="relative id-admin-container">
          <button onclick="toggleAdminDropdown(event)" class="flex items-center gap-2 hover:bg-gray-50 p-1.5 rounded-xl transition-colors duration-200">
            <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center text-gray-600">
              <i class="fas fa-user-shield"></i>
            </div>
            <span id="user-name" class="font-medium text-gray-700"></span>
            <i class="fas fa-chevron-down text-xs text-gray-400 ml-1"></i>
          </button>

          <div id="adminDropdownMenu" class="hidden absolute right-0 mt-2 w-56 bg-white border border-gray-100 rounded-2xl shadow-xl z-50 py-2 animate-fade-in">
            <div class="px-4 py-2 border-b border-gray-100">
              <p class="text-xs text-gray-400 font-medium uppercase tracking-wider">Account</p>
              <p id="dropdown-name" class="text-sm font-semibold text-gray-800 truncate"></p>
              <p id="dropdown-role" class="text-xs text-gray-500"></p>
            </div>

            <div class="p-1 border-b border-gray-100">
              <a id="menu-profile" href="/profile/profile.html" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600 hover:bg-slate-50 hover:text-blue-600 rounded-xl transition-colors">
                <i class="fas fa-id-card w-4 text-center text-gray-400"></i> Profile
              </a>
              <a id="menu-dashboard" href="#" onclick="alert('Trang Dashboard đang được phát triển.'); return false;" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600 hover:bg-slate-50 hover:text-blue-600 rounded-xl transition-colors">
                <i class="fas fa-sliders w-4 text-center text-gray-400"></i> Dashboard
              </a>
            </div>

            <div class="p-1">
              <a href="#" id="logout-btn" onclick="logout()" class="flex items-center gap-3 px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-xl transition-colors">
                <i class="fas fa-right-from-bracket w-4 text-center"></i> Logout
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- ================= RELATIONSHIPS CONTENT  ================= -->
    <section class="p-6 flex-1 overflow-auto">
      <div class="bg-white rounded-2xl border p-6 min-h-full flex flex-col">

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <h2 class="text-xl font-bold text-gray-800">Quan hệ hôn nhân</h2>

          <!-- Chỉ Admin thấy nút này -->
          <button
            id="addRelationshipBtn"
            onclick="openAddModal()"
            class="bg-gray-700 hover:bg-gray-800 text-white px-5 py-2.5 rounded-lg inline-flex items-center transition-colors"
          >
            <i class="fas fa-plus mr-2"></i>
            Thêm quan hệ
          </button>
        </div>

        <div id="relationshipsEmpty" class="hidden text-center text-gray-400 py-16">
          <i class="fas fa-heart text-4xl mb-3"></i>
          <p>Chưa có quan hệ hôn nhân nào được ghi nhận.</p>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="border-b text-gray-500">
                <th class="p-3">Vợ / Chồng</th>
                <th class="p-3">Ngày kết hôn</th>
                <th class="p-3">Trạng thái</th>
                <th class="p-3 text-center">Thao tác</th>
              </tr>
            </thead>
            <tbody id="relationshipsTableBody">
              <!-- render bằng JS -->
            </tbody>
          </table>
        </div>

      </div>
    </section>
  </main>
</div>

<!-- ================= MODAL: THÊM QUAN HỆ (chỉ Admin) ================= -->
<div id="addModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-md">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-bold">Thêm quan hệ hôn nhân</h3>
      <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600">
        <i class="fas fa-xmark text-xl"></i>
      </button>
    </div>

    <form id="addRelationshipForm" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Người thứ nhất</label>
        <input type="text" id="spouse1Search" placeholder="Gõ tên để tìm..." class="w-full border rounded-lg px-3 py-2 text-sm" autocomplete="off">
        <div id="spouse1Results" class="border rounded-lg mt-1 max-h-32 overflow-y-auto text-sm hidden"></div>
        <input type="hidden" id="spouse1Id">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Người thứ hai</label>
        <input type="text" id="spouse2Search" placeholder="Gõ tên để tìm..." class="w-full border rounded-lg px-3 py-2 text-sm" autocomplete="off">
        <div id="spouse2Results" class="border rounded-lg mt-1 max-h-32 overflow-y-auto text-sm hidden"></div>
        <input type="hidden" id="spouse2Id">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Ngày kết hôn (tùy chọn)</label>
        <input type="date" id="marriedOn" class="w-full border rounded-lg px-3 py-2 text-sm">
      </div>

      <button type="submit" class="w-full bg-gray-700 hover:bg-gray-800 text-white py-2.5 rounded-lg font-medium">
        Lưu
      </button>

    </form>
  </div>
</div>

<script src="/http.js"></script>
<script src="/escape-html.js"></script>
<script src="/api.js"></script>
<script src="relationships.js"></script>
<script src="/role-guard.js"></script>
</body>
</html>
