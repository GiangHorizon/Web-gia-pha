<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Member</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="bg-gray-100">
    <div class="max-w-4xl mx-auto bg-white min-h-screen border p-6">
      <div class="border-b pb-3 mb-5 flex items-center justify-between">
        <a href="member.html" class="text-sm text-gray-600 hover:text-black">
          <i class="fas fa-arrow-left mr-2"></i>Back
        </a>

        <div class="relative id-admin-container">
          <button onclick="toggleAdminDropdown(event)" class="flex items-center gap-2 hover:bg-gray-100 p-1.5 rounded-xl transition-colors duration-200">
            <div class="w-9 h-9 rounded-full bg-gray-300 flex items-center justify-center text-gray-600">
              <i class="fas fa-user-shield"></i>
            </div>
            <span id="user-name" class="font-medium text-gray-700 text-sm"></span>
            <i class="fas fa-chevron-down text-xs text-gray-400 ml-1"></i>
          </button>

          <div id="adminDropdownMenu" class="hidden absolute right-0 mt-2 w-56 bg-white border border-gray-100 rounded-2xl shadow-xl z-50 py-2">
            <div class="px-4 py-2 border-b border-gray-100">
              <p class="text-xs text-gray-400 font-medium uppercase tracking-wider">Account</p>
              <p id="dropdown-name" class="text-sm font-semibold text-gray-800 truncate"></p>
              <p id="dropdown-role" class="text-xs text-gray-500"></p>
            </div>

            <div class="p-1 border-b border-gray-100">
              <a id="menu-profile" href="/profile/profile.html" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600 hover:bg-slate-50 hover:text-blue-600 rounded-xl transition-colors">
                <i class="fas fa-id-card w-4 text-center text-gray-400"></i> Profile
              </a>
              <a id="menu-dashboard" href="#" onclick="alert('Trang Dashboard đang được phát triển.'); return false;" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600 hover:bg-slate-50 hover:text-blue-600 rounded-xl transition-colors">
                <i class="fas fa-sliders w-4 text-center text-gray-400"></i> Dashboard
              </a>
            </div>

            <div class="p-1">
              <a href="#" id="logout-btn" onclick="logout()" class="flex items-center gap-3 px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-xl transition-colors">
                <i class="fas fa-right-from-bracket w-4 text-center"></i> Logout
              </a>
            </div>
          </div>
        </div>
      </div>

      <form id="addMemberForm" class="space-y-5">
        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-3 text-sm font-medium">
            Full Name <span class="text-red-500">*</span>
          </label>
          <div class="col-span-9">
            <input
              id="name"
              type="text"
              placeholder="Enter full name"
              required
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-400"
            />
          </div>
        </div>

        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-3 text-sm font-medium">
            Gender <span class="text-red-500">*</span>
          </label>
          <div class="col-span-9">
            <select
              id="gender"
              class="w-full border rounded px-3 py-2 focus:outline-none"
              required
            >
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-3 text-sm font-medium">Date of Birth</label>
          <div class="col-span-9">
            <input
              id="date_birth"
              type="date"
              class="w-full border rounded px-3 py-2"
            />
          </div>
        </div>
        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-3 text-sm font-medium"
            >Date of Death (if applicable)</label
          >
          <div class="col-span-9">
            <input
              id="date_death"
              type="date"
              class="w-full border rounded px-3 py-2"
            />
          </div>
        </div>
        <div class="grid grid-cols-12 items-start gap-4 relative">
          <label class="col-span-3 text-sm font-medium pt-2">
            Dad/Mom <span class="text-red-500">*</span>
          </label>

          <div class="col-span-9 relative">
            <input
              type="text"
              id="parent-search"
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Gõ tên hoặc năm sinh để tìm..."
              autocomplete="off"
            />

            <input type="hidden" id="selected-parent-id" name="parent_id" />

            <div
              id="search-results"
              class="hidden absolute z-50 w-full bg-white border rounded-lg shadow-lg mt-1 max-h-60 overflow-y-auto divide-y divide-gray-100"
            ></div>
          </div>
        </div>
        <div class="grid grid-cols-12 gap-4">
          <label class="col-span-3 text-sm font-medium">Notes</label>
          <div class="col-span-9">
            <textarea
              id="note"
              rows="4"
              placeholder="Enter notes"
              class="w-full border rounded px-3 py-2 resize-none"
            ></textarea>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-8">
          <a
            href="member.html"
            class="px-6 py-2 border rounded hover:bg-gray-100 inline-flex items-center"
          >
            Cancel
          </a>
          <button
            type="submit"
            class="px-6 py-2 bg-gray-700 text-white rounded hover:bg-gray-800"
          >
            Save Member
          </button>
        </div>
      </form>
    </div>

    <script src="/http.js"></script>
<script src="/escape-html.js"></script>
<script src="/api.js"></script>
    <script src="addmember.js"></script>
    <script src="/role-guard.js"></script>
  </body>
</html>
