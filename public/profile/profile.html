<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gia Phả Họ Nguyễn - Hồ sơ cá nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="bg-slate-100">
    <div class="flex h-screen overflow-hidden">
      <!-- ================= SIDEBAR ================= -->
      <aside class="w-64 bg-white border-r">
        <div
          id="menu-toggle"
          class="h-20 flex items-center px-6 border-b cursor-pointer hover:bg-gray-50 transition-colors"
        >
          <i class="fas fa-bars text-2xl"></i>
        </div>

        <nav id="sidebar-nav" class="p-4 space-y-2">
          <a
            href="/public/mainpage/index.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100"
          >
            <i class="fas fa-house"></i> Home
          </a>
          <a
            href="/public/list/member.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100"
          >
            <i class="fas fa-users"></i> Members
          </a>
          <a
            href="/public/relationships/relationships.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100"
          >
            <i class="fas fa-link"></i> Relationships
          </a>
          <a
            href="/public/statistics/statistics.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100"
          >
            <i class="fas fa-chart-column"></i> Statistics
          </a>
          <a
            href="/public/documents/documents.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100"
          >
            <i class="fas fa-file"></i> Documents
          </a>
          <a
            href="/public/settings/settings.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100"
          >
            <i class="fas fa-gear"></i> Settings
          </a>
        </nav>
      </aside>

      <!-- MAIN CONTENT AREA -->
      <main class="flex-1 flex flex-col">
        <!-- ================= HEADER ================= -->
        <header
          class="h-20 bg-white border-b flex items-center justify-between px-8"
        >
          <h1 class="text-3xl font-bold">GIA PHẢ HỌ NGUYỄN</h1>

          <div class="flex items-center gap-5">
            

            <i
              class="far fa-bell text-xl cursor-pointer hover:text-gray-600"
            ></i>

            <!-- ADMIN DROPDOWN -->
            <div class="relative id-admin-container">
              <button
                id="admin-dropdown-btn"
                class="flex items-center gap-2 hover:bg-gray-50 p-1.5 rounded-xl transition-colors duration-200"
              >
                <div
                  class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center text-gray-600"
                >
                  <i class="fas fa-user-shield"></i>
                </div>
                <span class="font-medium text-gray-700 current-admin-name"
                  >Loading...</span
                >
                <i class="fas fa-chevron-down text-xs text-gray-400 ml-1"></i>
              </button>

              <div
                id="adminDropdownMenu"
                class="hidden absolute right-0 mt-2 w-56 bg-white border border-gray-100 rounded-2xl shadow-xl z-50 py-2"
              >
                <div class="px-4 py-2 border-b border-gray-100">
                  <p
                    class="text-xs text-gray-400 font-medium uppercase tracking-wider"
                  >
                    Account
                  </p>
                  <p
                    class="text-sm font-semibold text-gray-800 truncate current-admin-name"
                  >
                    Loading...
                  </p>
                </div>
                <div class="p-1 border-b border-gray-100">
                  <a
                    href="/public/profile/profile.html"
                    class="flex items-center gap-3 px-3 py-2 text-sm text-blue-600 bg-slate-50 rounded-xl"
                  >
                    <i class="fas fa-id-card w-4 text-center"></i> Profile
                  </a>
                  <a
                    href="/public/dashboard/dashboard.html"
                    class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600 hover:bg-slate-50 rounded-xl"
                  >
                    <i class="fas fa-sliders w-4 text-center"></i> Dashboard
                  </a>
                </div>
                <div class="p-1">
                  <a
                    href="/logout"
                    class="flex items-center gap-3 px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-xl"
                  >
                    <i class="fas fa-right-from-bracket w-4 text-center"></i>
                    Logout
                  </a>
                </div>
              </div>
            </div>
          </div>
        </header>

        <!-- ================= PROFILE CONTENT ================= -->
        <section class="p-6 flex-1 overflow-auto">
          <div class="bg-white rounded-2xl border p-6 min-h-full">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <!-- CỘT TRÁI -->
              <div class="space-y-6">
                <div class="border rounded-2xl p-6 text-center bg-slate-50/50">
                  <div class="relative w-32 h-32 mx-auto mb-4">
                    <div
                      class="w-full h-full rounded-full bg-gray-200 flex items-center justify-center text-gray-400 border border-slate-300 overflow-hidden"
                    >
                      <i
                        class="fas fa-user text-4xl"
                        id="profile-avatar-placeholder"
                      ></i>
                      <img
                        id="profile-avatar"
                        class="w-full h-full object-cover hidden"
                        src=""
                        alt="Avatar"
                      />
                    </div>
                  </div>
                  <h3 id="display-name" class="text-xl font-bold text-gray-900">
                    ---
                  </h3>
                  <p id="display-role" class="text-xs text-gray-500 mt-1">
                    ---
                  </p>
                </div>

                <div class="border rounded-2xl p-6 bg-white">
                  <h4 class="font-bold text-sm text-gray-900 mb-4">
                    <i class="fas fa-circle-info mr-2 text-slate-400"></i>Hệ
                    thống dòng tộc
                  </h4>
                  <ul class="space-y-3 text-xs">
                    <li
                      class="flex justify-between py-2 border-b border-slate-100"
                    >
                      <span class="text-gray-500">Thành viên liên kết:</span>
                      <span
                        id="sys-member-link"
                        class="font-semibold text-gray-800"
                        >Chưa liên kết</span
                      >
                    </li>
                    <li
                      class="flex justify-between py-2 border-b border-slate-100"
                    >
                      <span class="text-gray-500">Đời thứ:</span>
                      <span
                        id="sys-generation"
                        class="font-semibold text-gray-800"
                        >---</span
                      >
                    </li>
                  </ul>
                </div>
              </div>

              <!-- CỘT PHẢI: FORM CHỈNH SỬA -->
              <div class="lg:col-span-2">
                <div class="border rounded-2xl shadow-sm bg-white">
                  <div
                    class="p-5 border-b border-slate-100 flex justify-between items-center"
                  >
                    <h3 class="font-bold text-gray-900 text-lg">
                      Thông tin tài khoản
                    </h3>
                    <span class="text-xs text-gray-400"
                      >Dữ liệu thời gian thực</span
                    >
                  </div>

                  <form id="profile-form" class="p-6 space-y-4">
                    <!-- Hàng 1 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label
                          class="block text-xs font-semibold text-gray-600 mb-2"
                          >Họ và tên *</label
                        >
                        <input
                          type="text"
                          id="input-fullname"
                          class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:border-blue-500 bg-slate-50"
                          required
                        />
                      </div>
                      <div>
                        <label
                          class="block text-xs font-semibold text-gray-600 mb-2"
                          >Giới tính *</label
                        >
                        <select
                          id="input-gender"
                          class="w-full px-4 py-2.5 border rounded-xl text-sm bg-slate-50 focus:outline-none focus:border-blue-500"
                        >
                          <option value="Nam">Nam</option>
                          <option value="Nữ">Nữ</option>
                          <option value="Khác">Khác</option>
                        </select>
                      </div>
                    </div>

                    <!-- Hàng 2 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label
                          class="block text-xs font-semibold text-gray-600 mb-2"
                          >Ngày sinh *</label
                        >
                        <input
                          type="date"
                          id="input-birthday"
                          class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:border-blue-500 bg-slate-50"
                          required
                        />
                      </div>
                      <div>
                        <label
                          class="block text-xs font-semibold text-gray-600 mb-2"
                          >Số điện thoại</label
                        >
                        <input
                          type="tel"
                          id="input-phone"
                          class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:border-blue-500 bg-slate-50"
                          placeholder="Nhập số điện thoại..."
                        />
                      </div>
                    </div>

                    <!-- Hàng 3 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label
                          class="block text-xs font-semibold text-gray-600 mb-2"
                          >Địa chỉ Gmail</label
                        >
                        <input
                          type="email"
                          id="input-gmail"
                          class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:border-blue-500 bg-slate-50"
                          placeholder="example@gmail.com"
                        />
                      </div>
                      <div>
                        <label
                          class="block text-xs font-semibold text-gray-600 mb-2"
                          >Nơi ở hiện tại</label
                        >
                        <input
                          type="text"
                          id="input-address"
                          class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:border-blue-500 bg-slate-50"
                          placeholder="Thành phố, Quốc gia..."
                        />
                      </div>
                    </div>

                    <!-- Nút Hành động -->
                    <div
                      class="pt-4 border-t border-slate-100 flex justify-end gap-3"
                    >
                      <button
                        type="button"
                        id="btn-reload"
                        class="px-5 py-2.5 border rounded-xl text-sm font-medium hover:bg-gray-50 transition-colors"
                      >
                        Tải lại
                      </button>
                      <button
                        type="submit"
                        class="px-6 py-2.5 bg-gray-900 text-white hover:bg-gray-800 rounded-xl text-sm font-medium shadow-sm transition-colors"
                      >
                        Lưu cấu hình
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="profile.js"></script>
  </body>
</html>
